[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netools"
version = "2.0.0"
description = "⚡ Netools Suite: Sing-box Proxy Rotator, GRC 3-Tier DNS Benchmark, DNS Switcher & PAC Server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Azhar", email = "azhar@netools.local" }
]
keywords = [
    "dns", "dns-jumper", "singbox", "proxy-rotator", "grc-benchmark",
    "doh", "dot", "vless", "trojan", "shadowsocks", "network-utility"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]
dependencies = [
    "customtkinter>=5.2.0",
    "pillow>=9.5.0",
    "pystray>=0.19.5",
    "dnspython>=2.0.0",
    "aiodns>=3.0.0; sys_platform != 'win32'",
    "uvloop>=0.19.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
netools = "netools.cli.main:main"

[project.urls]
Homepage = "https://github.com/Azhar457/Netools"
Documentation = "https://azhar457.github.io/Netools/"
Repository = "https://github.com/Azhar457/Netools.git"
Issues = "https://github.com/Azhar457/Netools/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["netools*"]

[tool.setuptools.package-data]
netools = ["*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["F", "I", "B", "RUF"]
ignore = ["B904", "B008", "RUF001", "RUF013"]  # B904: raise from legacy; B008: fn call default arg; RUF001: unicode display chars; RUF013: legacy Optional

[tool.ruff.format]
docstring-code-format = true
