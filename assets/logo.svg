<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Ring / Orbital Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="50%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#313244" stroke-width="6"/>

  <!-- Outer Orbital Proxy Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="70 24 140 30" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Satellite Proxy Nodes -->
  <circle cx="256" cy="84" r="14" fill="#89b4fa" filter="url(#outerGlow)"/>
  <circle cx="428" cy="256" r="12" fill="#cba6f7" filter="url(#outerGlow)"/>
  <circle cx="256" cy="428" r="14" fill="#a6e3a1" filter="url(#outerGlow)"/>
  <circle cx="84" cy="256" r="12" fill="#f9e2af" filter="url(#outerGlow)"/>

  <circle cx="378" cy="134" r="9" fill="#89dceb" opacity="0.85"/>
  <circle cx="134" cy="378" r="9" fill="#94e2d5" opacity="0.85"/>

  <!-- Inner Dynamic Shield Core -->
  <path d="M 256 120 L 340 162 C 340 260 290 326 256 360 C 222 326 172 260 172 162 Z" fill="#181825" stroke="#45475a" stroke-width="4" opacity="0.9"/>

  <!-- High-Voltage Turbo Lightning Bolt -->
  <polygon points="274,136 198,266 252,266 238,376 314,246 260,246" fill="url(#boltGrad)" filter="url(#outerGlow)"/>
</svg>
