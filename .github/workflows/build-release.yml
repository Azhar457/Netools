name: Build and Release Netools Suite (AppImage & Windows .EXE)

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netools-Linux-AppImage
          path: dist/Netools-x86_64.AppImage

  build-windows-exe:
    name: Build Windows Single .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Single-File .EXE
        run: |
          pyinstaller --name netools `
            --onefile `
            --windowed `
            --collect-all netools `
            --add-data "dns_jumper_db.py;." `
            --add-data "dns_jumper_benchmark.py;." `
            --clean `
            netools.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netools-Windows-EXE
          path: dist/netools.exe

  release:
    name: Publish GitHub Release
    needs: [build-linux-appimage, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Netools-Linux-AppImage/Netools-x86_64.AppImage
            Netools-Windows-EXE/netools.exe
          draft: false
          prerelease: false
