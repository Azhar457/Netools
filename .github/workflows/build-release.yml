name: Build & Release Netools Suite (Linux AppImage & Windows .EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release now?'
        required: true
        type: boolean
        default: true

jobs:
  build-linux-appimage:
    name: 🐧 Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & AppImage tools
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Build Standalone AppImage
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netools-Linux-AppImage
          path: dist/Netools-x86_64.AppImage

  build-windows-exe:
    name: 🪟 Build Windows Single .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller & GUI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow

      - name: Build Single-File Portable .EXE
        run: |
          pyinstaller --name "Netools-Windows-x64" `
            --onefile `
            --windowed `
            --icon "assets/icon.ico" `
            --collect-all netools `
            --collect-all customtkinter `
            --add-data "dns_jumper_db.py;." `
            --add-data "dns_jumper_benchmark.py;." `
            --add-data "assets;assets" `
            --clean `
            netools.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netools-Windows-EXE
          path: dist/Netools-Windows-x64.exe

  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-linux-appimage, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.0.0-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Netools Suite ${{ steps.tag_info.outputs.tag }}
          body: |
            ## ⚡ Netools Suite v2.0 Release
            
            All-in-one network suite for GRC-style 3-tier DNS benchmarking, Smart Split-DNS switching, Sing-box proxy rotation, and AI Gateway routing.

            ### 📦 Download Binaries:
            - **Linux**: `Netools-x86_64.AppImage` (Run directly with `chmod +x` on any Linux distro)
            - **Windows**: `Netools-Windows-x64.exe` (Standalone portable single executable, no Python required)
          files: |
            Netools-Linux-AppImage/Netools-x86_64.AppImage
            Netools-Windows-EXE/Netools-Windows-x64.exe
          draft: false
          prerelease: false
